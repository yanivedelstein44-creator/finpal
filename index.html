<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F2EA">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://*.googleusercontent.com https://drive.usercontent.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>FinPal משפחה</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-96.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="hidden">
    <header class="topbar" id="topbar">
      <div class="who" id="who"></div>
      <div class="top-actions">
        <button class="icon-btn" id="importBtn" aria-label="ייבוא קובץ מהבנק או מהאשראי">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
        </button>
        <button class="icon-btn" id="syncBtn" aria-label="סנכרון עם Google Drive">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
          <span class="badge hidden" id="syncBadge"></span>
        </button>
      </div>
    </header>
    <div id="banners"></div>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="ניווט">
      <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg><span>הבית</span></button>
      <button data-tab="save"><svg viewBox="0 0 24 24"><path d="M12 20.5v-8.5M12 12C12 8 9.3 5.2 5 5.2c0 4.3 2.8 6.8 7 6.8zM12 14.2c0-3.6 2.5-6.2 6.8-6.2 0 3.9-2.6 6.2-6.8 6.2z"/></svg><span>חיסכון</span></button>
      <button data-tab="tx"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg><span>תנועות</span></button>
      <button data-tab="months"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>חודשים</span></button>
      <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg><span>עוד</span></button>
    </nav>
  </div>

  <div id="screen" class="screen hidden" role="main"></div>
  <div id="lock" class="lock hidden" role="dialog" aria-modal="true" aria-labelledby="lockTitle"></div>
  <div id="sheet" class="overlay hidden"><div class="sheet-modal" id="sheetBody" role="dialog" aria-modal="true"></div></div>
  <div id="busy" class="busy hidden" role="status" aria-live="polite"><div class="spinner"></div><p id="busyText"></p></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" class="hidden" multiple accept=".xls,.xlsx,.csv,.xml,.html,.htm,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/xml,application/xml,text/html">

  <noscript><p class="empty">כדי להשתמש ב-FinPal צריך להפעיל JavaScript בדפדפן.</p></noscript>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
