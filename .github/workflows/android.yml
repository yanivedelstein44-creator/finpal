# Builds the FinPal Family APK (a Trusted Web Activity for the site) on GitHub's machines, which have the
# Android tools. The APK is built unsigned and kept in this branch; it is signed separately with the
# family's own key, so no key is stored on GitHub.
name: Android APK

on:
  push:
    branches: [android]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Keep the unsigned APK in this branch
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/FinPal-unsigned.apk
          sha256sum out/FinPal-unsigned.apk | tee out/FinPal-unsigned.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git commit -m "Unsigned APK from run ${{ github.run_id }}"
          git push
