# One-off maintenance: a GitHub Pages deployment got stuck "in progress" on GitHub's side and blocks every
# new deployment of the site. This cancels it and asks GitHub to build the site again from main.
name: Pages unstick

on:
  push:
    branches: [android]
    paths: ['.github/workflows/pages-unstick.yml']

permissions:
  pages: write
  contents: read

jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stuck deployment and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/$REPO/pages/deployments/3431600365ca4f3a8311d11488a7e73b5d5f134b/cancel" || echo "cancel failed"
          sleep 10
          gh api "repos/$REPO/pages/deployments/3431600365ca4f3a8311d11488a7e73b5d5f134b" || true
          gh api -X POST "repos/$REPO/pages/builds" || echo "build request failed"
